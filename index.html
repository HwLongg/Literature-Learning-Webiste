<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico?v=1">
    <title>Ngữ Văn 9 | Ôn Thi Vào 10</title>
    <style>
        /* ================= THEME VARIABLES (LITERATURE RED/WARM EDITION) ================= */
        :root {
            --bg-color: #faf5f0; 
            --header-bg: rgba(255, 252, 248, 0.9);
            --primary-color: #9f1239; /* Đỏ mận/đỏ thẫm sang trọng */
            --soft-color: #ffe4e6;
            --card-bg: #ffffff;
            --text-dark: #3f2a2a;
            --text-light: #785a5a;
            --accent-color: #059669; /* Xanh lục bảo tạo điểm nhấn */
            --border: #f3e8e8;
        }

        [data-theme="dark"] {
            --bg-color: #271c19; 
            --header-bg: rgba(39, 28, 25, 0.95);
            --primary-color: #fb7185; /* Hồng phấn/đỏ pastel sáng */
            --soft-color: #4a2c2a;
            --card-bg: #362624;
            --text-dark: #fdf8f5;
            --text-light: #d4b8b8;
            --accent-color: #34d399;
            --border: #5e423f;
        }

        /* ================= GENERAL SETUP ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(var(--soft-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--soft-color) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-dark);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }

        header {
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--primary-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: 'Cambria', serif;
        }

        .logo-img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 12px;
            background: white;
            padding: 4px;
            border: 2px solid var(--primary-color);
        }

        /* Container chứa 2 nút điều hướng */
        .header-actions {
            display: flex;
            gap: 10px;
        }

        .theme-switch {
            background: var(--soft-color);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none; /* Bỏ gạch chân cho link báo lỗi */
            font-size: 14px;
            white-space: nowrap;
        }
